# Copiare in /etc/apache2/sites-available/ e abilitare con a2ensite padova-stage.
# certbot --apache crea poi la copia su 443 con i certificati e il redirect da http.

<VirtualHost *:80>
    ServerName padova-stage-backend.back-iot.it

    ProxyPreserveHost On
    ProxyRequests Off
    # Odoo in proxy_mode costruisce gli URL con lo schema ricevuto qui
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass        /websocket ws://127.0.0.1:8069/websocket
    ProxyPassReverse /websocket ws://127.0.0.1:8069/websocket
    ProxyPass        / http://127.0.0.1:8069/
    ProxyPassReverse / http://127.0.0.1:8069/

    ErrorLog ${APACHE_LOG_DIR}/padova-stage-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/padova-stage-backend-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName padova-frontend-stage.back-iot.it
    DocumentRoot /var/www/padova-frontend-stage

    <Directory /var/www/padova-frontend-stage>
        Require all granted
        Options -Indexes
        # mude-app è una single page app: le rotte del client tornano a index.html
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/padova-frontend-stage-error.log
    CustomLog ${APACHE_LOG_DIR}/padova-frontend-stage-access.log combined
</VirtualHost>
