volumes:
    camajora_data_migration:
    camajora_pgdata_migration_odoo:
services:
  odoo:
    build: .
    image: mudesrl/service.back-iot:1.0
    ports:
      - "80:80"
      - "8069:80"
    depends_on:
      - postgres
    links:
      - "postgres:postgres"
    environment:
      - ODOO_DB_HOST=postgres
      - ODOO_DB_NAME=odoo_camajora
      - ODOO_DB_USER=odoo
      - ODOO_DB_PASSWORD=odoo
      - ODOO_DB_PORT=5432
      - ODOO_WORKERS=7
      - ODOO_LIMIT_TIME_CPU=120000
      - ODOO_LIMIT_TIME_REAL=132000
      - ODOO_QUEUE_JOB_CHANNELS=root:6
      - ODOO_LIMIT_MEMORY_HARD=6845104128
      - ODOO_LIMIT_MEMORY_SOFT=5704253440
    volumes:
      - "camajora_data_migration:/var/lib/odoo/"
      - "./addons/camajora-addons:/mnt/bundle-addons/camajora-addons"
      - "./external/connector:/mnt/bundle-addons/connector"
      - "./external/queue:/mnt/bundle-addons/queue"
      - "./external/server-tools:/mnt/bundle-addons/server-tools"
      - "./external/server-ux:/mnt/bundle-addons/server-ux"
      - "./external/rest-framework:/mnt/bundle-addons/rest-framework"
    command: run  -d odoo_camajora --dev=all --db-filter odoo_camajora
  odoo-init:
    build: .
    image: mudesrl/service.back-iot:1.0
    ports:
      - "80:80"
      - "8069:80"
    depends_on:
      - postgres
    links:
      - "postgres:postgres"
    environment:
      - ODOO_DB_HOST=postgres
      - ODOO_DB_NAME=odoo_camajora
      - ODOO_DB_USER=odoo
      - ODOO_DB_PASSWORD=odoo
      - ODOO_DB_PORT=5432
      - ODOO_WORKERS=7
      - ODOO_LIMIT_TIME_CPU=120000
      - ODOO_LIMIT_TIME_REAL=132000
      - ODOO_QUEUE_JOB_CHANNELS=root:6
      - ODOO_LIMIT_MEMORY_HARD=6845104128
      - ODOO_LIMIT_MEMORY_SOFT=5704253440
    volumes:
      - "camajora_data_migration:/var/lib/odoo/"
      - "./addons/camajora-addons:/mnt/bundle-addons/camajora-addons"
      - "./external/connector:/mnt/bundle-addons/connector"
      - "./external/queue:/mnt/bundle-addons/queue"
      - "./external/server-tools:/mnt/bundle-addons/server-tools"
      - "./external/server-ux:/mnt/bundle-addons/server-ux"
      - "./external/rest-framework:/mnt/bundle-addons/rest-framework"
    profiles:
      - init
    command: run  -d odoo_camajora -i base --without-demo=all --stop-after-init --dev=all --db-filter odoo_camajora

  postgres:
    image: postgres:15.0
    ports:
       - "5432:5432"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - "camajora_pgdata_migration_odoo:/var/lib/postgresql/data"

  
